<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1cd45">
  <meta name="description" content="GRAMMAR SKYFALL — Present Simple EDITION. Online English grammar battle game for 2–6 players.">
  <title>GRAMMAR SKYFALL — Present Simple EDITION</title>
  <link rel="stylesheet" href="css/styles.css?v=27">

<style id="musicCriticalStyle">
#musicToggle{position:fixed;right:18px;top:14px;z-index:9999;display:inline-flex;align-items:center;gap:9px;min-height:42px;padding:8px 12px 8px 10px;border:1px solid rgba(255,255,255,.22);border-radius:14px;color:#fff;background:linear-gradient(135deg,rgba(17,18,24,.92),rgba(29,30,39,.82));box-shadow:0 10px 26px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;font-size:10px;font-weight:1000;letter-spacing:1.5px;text-shadow:0 2px 8px rgba(0,0,0,.42);cursor:pointer;transition:transform .14s ease,filter .14s ease,border-color .2s ease,background .2s ease}
#musicToggle:hover{transform:translateY(-2px);filter:brightness(1.08);border-color:rgba(255,255,255,.34)}
#musicToggle:active{transform:translateY(2px) scale(.985)}
#musicToggle .music-toggle-icon{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:16px;font-weight:1000;background:rgba(241,205,69,.18);color:#ffe98b;box-shadow:inset 0 1px rgba(255,255,255,.16)}
#musicToggle .music-toggle-label{line-height:1;white-space:nowrap}
#musicToggle .music-toggle-dot{width:8px;height:8px;border-radius:50%;background:#42e58c;box-shadow:0 0 12px rgba(66,229,140,.78)}
#musicToggle.is-off{background:linear-gradient(135deg,rgba(12,13,17,.96),rgba(22,23,30,.86));border-color:rgba(255,255,255,.14)}
#musicToggle.is-off .music-toggle-icon{background:rgba(255,255,255,.08);color:#c5cad4}
#musicToggle.is-off .music-toggle-dot{background:#777d88;box-shadow:none}
@media(max-width:720px){#musicToggle{right:10px;top:10px;min-height:38px;padding:7px 9px;border-radius:12px}#musicToggle .music-toggle-label{font-size:9px;letter-spacing:1.1px}#musicToggle .music-toggle-icon{width:22px;height:22px;font-size:14px}#musicToggle .music-toggle-dot{width:7px;height:7px}}
</style>
</head>
<body>
  <div id="bootScreen" class="layer boot-layer">
    <div class="boot-card">
      <div class="boot-mark">GS</div>
      <div class="boot-kicker">ONLINE GRAMMAR BATTLE</div>
      <h1>GRAMMAR SKYFALL</h1>
      <div class="boot-sub">— Present Simple EDITION —</div>
      <div class="boot-orbit orbit-1"></div><div class="boot-orbit orbit-2"></div>
      <div class="loader"><span id="loaderBar"></span></div>
      <div id="loaderText" class="boot-status">LOADING ENGLISH ENGINE...</div>
      <button id="bootPlay" class="primary-btn hidden">PLAY <span>▶</span></button>
    </div>
  </div>

  <div id="countdown" class="layer countdown-layer hidden">
    <div id="countdownNum" class="countdown-num">3</div>
    <div class="countdown-sub">GET READY</div>
  </div>

  <div id="app" class="app hidden">
    <button id="secretBtn" class="secret-access" aria-label="Open test mode">▦</button>
    <button id="musicToggle" class="music-toggle" type="button" aria-pressed="true" aria-label="Music is on. Click to turn it off" title="Turn music off">
      <span class="music-toggle-icon" aria-hidden="true">♪</span>
      <span class="music-toggle-label">MUSIC ON</span>
      <span class="music-toggle-dot" aria-hidden="true"></span>
    </button>
    <header class="topbar">
      <div class="brand">
        <div class="brand-symbol">GS</div>
        <div>
          <div class="brand-name">GRAMMAR SKYFALL</div>
          <div class="brand-sub">Present Simple EDITION</div>
        </div>
      </div>
      <div class="hud">
        <span class="hud-chip">ROOM <b id="hudRoom">—</b></span>
        <span class="hud-chip">ROUND <b id="hudRound">—</b></span>
        <span class="hud-chip">ALIVE <b id="hudAlive">—</b></span>
      </div>
    </header>

    <main id="screen" class="screen"></main>
    <div id="overlay" class="overlay hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="confetti" class="confetti"></div>
  </div>

  <script src="js/questions.js?v=27"></script>
  <script src="js/bank.js?v=27"></script>
  <script src="js/online.js?v=27"></script>
  <script src="js/audio.js?v=27"></script>
  <script src="js/solo.js?v=27"></script>
  <script src="js/game.js?v=27"></script>
</body>
</html>
